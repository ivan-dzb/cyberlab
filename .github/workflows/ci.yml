name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tipos y pruebas unitarias (sin Docker).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  # Pila completa: aislamiento (US-09), retos resolubles (US-14) y pruebas end-to-end con Playwright.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create .env with throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "ORCH_TOKEN=$(openssl rand -hex 32)"
            echo "GATEWAY_TOKEN=$(openssl rand -hex 32)"
          } > .env
      - name: Build challenge images
        run: node scripts/build-challenges.mjs
      - name: Start the stack
        run: docker compose up -d --build
      - name: Apply migrations and sync challenges
        run: |
          docker compose exec -T app npm run migrate
          docker compose exec -T app npm run sync:challenges
      - name: Isolation tests
        run: docker compose exec -T app npm run test:isolation
      - name: Every challenge is solvable
        run: docker compose exec -T app npm run test:challenges
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 150
